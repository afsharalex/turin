[package]
name = "turin"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
